services:
  pit38-calculator:
    build: .
    container_name: pit38-calculator
    ports:
      - "${PIT38_PORT:-18080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
