server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Build assets carry a content hash in the filename — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Bundled NBP rate tables. No SPA fallback here: the app treats a 404 as
    # "year not bundled" and falls back to the NBP API.
    location /nbp_rates/ {
        # nginx's mime.types has no .csv entry, so these would otherwise be
        # application/octet-stream and fall outside gzip_types.
        default_type text/csv;
        expires 1d;
    }

    # index.html must never be cached, or a rebuild keeps serving stale assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
